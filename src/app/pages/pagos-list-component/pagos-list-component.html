<div class="overflow-x-auto">
    <header class="flex justify-content-between align-items-center">
        <h4 class="font-bold text-lg mb-2">Mis Pagos <div class="badge badge-ghost badge-outline">{{ pagos().length }}
            </div>
        </h4>
    </header>
    <!--     <ul>
        @for (pago of listaPagos(); track pago.id) {
        <li>
            ID Firebase: {{ pago.id }} |
            Concepto: {{ pago.concepto }} |
            Dia: {{ pago.dia_vencimiento }} |
            Estado: {{ pago.estado }}
        </li>
        }
    </ul> -->
    <div class="overflow-x-auto">
        <table class="table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Concepto</th>
                    <th>Día</th>
                    <th>Categoría</th>
                    <th>Monto Estimado</th>
                    <th>Estado</th>
                    <!-- <th>Fecha de pago</th> -->
                </tr>
            </thead>
            <tbody>
                <!--  <tr>
                    <th>1</th>
                    <td>Cy Ganderton</td>
                    <td>Quality Control Specialist</td>
                    <td>Blue</td>
                </tr> -->
                @for (pago of pagos(); track pago.id) {
                  <tr [style.background-color]="pago.colorEstado">
                      <td>{{pago.id}}</td>
                      <td>{{pago.concepto}}</td>
                      <td>{{pago.dia_vencimiento}}</td>
                      <td><div class="badge badge-soft" [style.background-color]="pago.colorCategoria">{{pago.nombreCategoria}}</div></td>
                      <td class="flex justify-end">{{pago.monto_estimado | currency:'Gs. ':'symbol':'1.0-0'}}</td>
                      <td>
                        <!-- <div class="badge badge-soft" [style.background-color]="pago.colorEstado">{{pago.nombreEstado}}</div> -->
                        <select class="select select-sm select-neutral w-full max-w-xs"
                        (change)="cambiarEstado(pago.id, $event)">
                          @for (item of estados(); track item.id) {
                            <option [value]="item.id" [selected]="item.id === pago.estado.id">
                              <span>{{item.nombre}}</span>
                            </option>
                          }
                        </select>
                      </td>
                      <!-- <td>{{ pago.fecha_pago ? (pago.fecha_pago.toDate() | date:'dd/MM/yyyy') : '-' }}</td> [(ngModel)]="pago.estado.id"-->
                  </tr>
                } @empty {
                  <tr>
                      <td colspan="6" class="text-center">No hay registros.</td>
                  </tr>
                }
                <!-- class="bg-base-200" badge-[bg-{{pago.colorCategoria}}-500]-->
            </tbody>
        </table>
    </div>
</div>
