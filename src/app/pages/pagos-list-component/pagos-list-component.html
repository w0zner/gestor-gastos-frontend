<div class="container">
    <header class="flex justify-content-between align-items-center">
        <h2>Mis Pagos ({{ cantidadPagos() }})</h2>

    </header>

    <ul>
        @for (pago of listaPagos(); track pago.id) {
        <li>
            ID Firebase: {{ pago.id }} |
            Concepto: {{ pago.concepto }} |
            Dia: {{ pago.dia_vencimiento }} |
            Estado: {{ pago.estado }}
        </li>
        }
    </ul>
</div>
