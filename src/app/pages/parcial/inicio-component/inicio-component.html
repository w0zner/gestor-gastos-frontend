<!-- Componente de Navegación superior -->
<app-navigation-component></app-navigation-component>

<!-- Contenedor principal responsive -->
<div class="relative p-2 sm:p-4 min-h-[calc(100vh-68px)] bg-base-300">
  <div class="grid grid-cols-12 gap-4">

    <!-- Contenido Principal -->
    <main
      class="col-span-12 bg-base-100 border border-base-300 p-3 sm:p-6 rounded-box shadow-sm transition-all duration-300"
      [class]="sidebarService.isOpen() ? 'md:col-span-9 lg:col-span-10' : 'md:col-span-12'">
      <router-outlet></router-outlet>
    </main>

    <!-- Backdrop oscuro solo en mobile cuando el panel está abierto -->
    @if (sidebarService.isOpen()) {
      <div
        class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 md:hidden transition-opacity"
        (click)="sidebarService.close()"
        aria-label="Cerrar panel">
      </div>
    }

    <!-- Panel lateral (Drawer en mobile, columna fija en desktop) -->
    <aside
      class="bg-base-200 transition-all duration-300 z-50
             fixed top-0 right-0 h-full w-72 p-6 shadow-2xl flex flex-col
             md:static md:w-auto md:h-auto md:z-auto md:shadow-none md:p-6 md:rounded-box md:col-span-3 lg:col-span-2"
      [class.hidden]="!sidebarService.isOpen()">

      <div class="flex justify-between items-center pb-3 border-b border-base-300 mb-4">
        <h3 class="font-bold text-lg">Panel</h3>
        <button
          type="button"
          class="btn btn-ghost btn-circle btn-sm"
          (click)="sidebarService.close()"
          aria-label="Cerrar panel">
          ✕
        </button>
      </div>

      <!-- Menú de navegación -->
      <ul class="menu bg-base-200 rounded-box w-full gap-1 p-0">
        <li>
          <a routerLink="/inicio/pagos" routerLinkActive="menu-active" (click)="sidebarService.close()" class="py-2.5">
            <i class="fi fi-br-document text-base"></i>Pagos
          </a>
        </li>
        <li>
          <a routerLink="/inicio/plantillas" routerLinkActive="menu-active" (click)="sidebarService.close()" class="py-2.5">
            <i class="fi fi-br-eye text-base"></i>Plantillas
          </a>
        </li>
        <li>
          <a routerLink="/inicio/categorias" routerLinkActive="menu-active" (click)="sidebarService.close()" class="py-2.5">
            <i class="fi fi-br-file text-base"></i>Categorías
          </a>
        </li>
        <li>
          <a routerLink="/inicio/estados" routerLinkActive="menu-active" (click)="sidebarService.close()" class="py-2.5">
            <i class="fi fi-br-folder text-base"></i>Estados
          </a>
        </li>
      </ul>
    </aside>

  </div>
</div>

<!-- Footer -->
<footer class="footer footer-center p-4 bg-base-300 text-base-content text-xs sm:text-sm mt-auto">
  <aside>
    <p>Copyright © 2026 - Todos los derechos reservados</p>
  </aside>
</footer>
