<div class="navbar bg-base-100 shadow-sm px-2 sm:px-4">
  <!-- Botón para abrir/cerrar el panel lateral -->
  <div class="flex-none">
    <button type="button" class="btn btn-ghost btn-square btn-sm sm:btn-md" (click)="sidebarService.toggle()" aria-label="Alternar menú">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        class="inline-block w-5 h-5 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Título / Logo -->
  <div class="flex-1 min-w-0 px-2">
    <a class="btn btn-ghost text-lg sm:text-xl font-bold px-1 sm:px-2">Gestalo</a>
  </div>

      class="hidden md:flex items-center text-sm font-medium text-base-content/80 max-w-[200px] truncate">
