@if (isOpen()) {
<dialog #dialog id="my_modal_1" class="modal">
    <div class="modal-box w-3/12">
        <h3 class="text-lg font-bold">{{title()}}</h3>
        <p class="py-4">{{message()}}</p>
        <div class="modal-action">
            <form method="dialog">
                <div class="flex gap-2">
                    <button class="btn btn-outline btn-lg" (click)="cancel()">No</button>
                    <button class="btn btn-success btn-lg" (click)="confirm()">Si</button>
                </div>
            </form>
        </div>
    </div>
</dialog>
}
