@if (isOpen()) {
<dialog #dialog id="my_modal_1" class="modal modal-middle">
    <div class="modal-box w-11/12 max-w-md sm:w-9/12 md:w-6/12 lg:w-4/12 xl:w-3/12">
        <h3 class="text-base sm:text-lg font-bold break-words">{{ title() }}</h3>
        <p class="py-3 sm:py-4 text-sm sm:text-base break-words">{{ message() }}</p>
        <div class="modal-action">
            <form method="dialog" class="w-full sm:w-auto">
                <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
                    <button type="button" class="btn btn-outline btn-md sm:btn-lg w-full sm:w-auto" (click)="cancel()">
                        No
                    </button>
                    <button type="button" class="btn btn-success btn-md sm:btn-lg w-full sm:w-auto" (click)="confirm()">
                        Si
                    </button>
                </div>
            </form>
        </div>
    </div>
</dialog>
}
